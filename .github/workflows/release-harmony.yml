name: Release - HarmonyOS

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish HarmonyOS artifacts for, e.g. AGenUI-1.3.2'
        required: true
        type: string

permissions:
  contents: write

env:
  # HarmonyOS Command Line Tools version (from HuggingFace mirror)
  # Must match project's hvigor modelVersion (6.0.0 requires CLT 6.x)
  CLT_VERSION: "6.0.1.251"
  CLT_FILENAME: "commandline-tools-linux-x64-6.0.1.251.zip"

jobs:
  release-harmony:
    name: Build & Publish HarmonyOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run for AGenUI-* tags (release event) or manual dispatch with such a tag
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'AGenUI-')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'AGenUI-'))

    steps:
      # ==================== Setup ====================
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # For manual dispatch, check out the exact tag being (re)published;
          # for a release event the default (tag commit) is already correct.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#AGenUI-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION} from tag: ${TAG}"

          # Extract base version (x.y.z) - used for artifact naming
          BASE_VERSION=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Base version: ${BASE_VERSION}"

          # Determine if this is a stable release (x.y.z only, no suffix)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "This is a STABLE release"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "This is a PRE-RELEASE (${VERSION})"
          fi

      - name: Verify version consistency
        run: |
          HEADER_VERSION=$(grep -o '#define AGENUI_VERSION "[^"]*"' core/include/agenui_version.h | sed 's/#define AGENUI_VERSION "//;s/"//')
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          if [[ "$HEADER_VERSION" != "$BASE_VERSION" ]]; then
            echo "::error::Version mismatch! Tag base version: ${BASE_VERSION}, agenui_version.h: ${HEADER_VERSION}"
            echo "Please ensure the version in core/include/agenui_version.h matches the tag."
            exit 1
          fi
          echo "✅ Version verified: header=${HEADER_VERSION}, tag base=${BASE_VERSION}"

      # The OHPM-published version comes from the HAR's embedded
      # oh-package.json5, so it must also match the tag. build.sh only warns
      # on mismatch, but a wrong/duplicate version would fail on the public
      # registry (same version cannot be re-published), so fail fast here.
      - name: Verify oh-package.json5 version
        run: |
          PKG_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' platforms/harmony/agenui/oh-package.json5 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/"//')
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          if [[ "$PKG_VERSION" != "$BASE_VERSION" ]]; then
            echo "::error::Version mismatch! Tag base version: ${BASE_VERSION}, oh-package.json5: ${PKG_VERSION}"
            echo "Please update platforms/harmony/agenui/oh-package.json5 to match the tag before releasing."
            exit 1
          fi
          echo "✅ oh-package.json5 version verified: ${PKG_VERSION}"

      # ==================== Build Environment ====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache HarmonyOS Command Line Tools
        id: cache-clt
        uses: actions/cache@v6
        with:
          path: ${{ env.CLT_FILENAME }}
          key: harmonyos-clt-${{ env.CLT_FILENAME }}

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-clt.outputs.cache-hit != 'true'
        run: |
          curl -SL -O "https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/${CLT_FILENAME}"

      - name: Extract Command Line Tools
        run: |
          unzip -q "${CLT_FILENAME}" -d .
          echo "Command Line Tools extracted"

      - name: Configure build environment
        run: |
          CLT_ROOT="$(pwd)/command-line-tools"
          echo "DEVECO_HOME=${CLT_ROOT}" >> $GITHUB_ENV
          echo "DEVECO_SDK_HOME=${CLT_ROOT}/sdk" >> $GITHUB_ENV
          echo "HOS_SDK_HOME=${CLT_ROOT}/sdk" >> $GITHUB_ENV

          # Add tool binaries to PATH
          echo "${CLT_ROOT}/bin" >> $GITHUB_PATH
          echo "${CLT_ROOT}/hvigor/bin" >> $GITHUB_PATH
          echo "${CLT_ROOT}/ohpm/bin" >> $GITHUB_PATH
          echo "${CLT_ROOT}/tool/node/bin" >> $GITHUB_PATH

      # ==================== Build HAR ====================
      - name: Build HarmonyOS HAR
        env:
          AGENUI_FULL_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/harmony/build.sh --mode release

      - name: Verify HAR artifacts
        run: |
          HAR_PATH="dist/harmony/release/agenui.har"
          LITE_PATH="dist/harmony/release/agenui-lite.har"
          if [[ ! -f "$HAR_PATH" ]]; then
            echo "::error::Expected HAR not found: ${HAR_PATH}"
            ls -la dist/harmony/release/ 2>/dev/null || echo "dist/harmony/release/ does not exist"
            exit 1
          fi
          if [[ ! -f "$LITE_PATH" ]]; then
            echo "::error::Expected lite HAR not found: ${LITE_PATH}"
            exit 1
          fi
          echo "✅ HAR artifacts verified:"
          ls -lh dist/harmony/release/

      # ==================== Upload to GitHub Release ====================
      - name: Upload HAR to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          TAG="${{ steps.version.outputs.tag }}"

          # Upload the full HAR (with all .so included)
          HAR_DEST="AGenUI-${BASE_VERSION}-harmony.har"
          cp "dist/harmony/release/agenui.har" "${HAR_DEST}"

          echo "Uploading ${HAR_DEST} to release ${TAG}..."
          gh release upload "${TAG}" "${HAR_DEST}" --clobber
          echo "✅ Upload complete"

      # ==================== OHPM Publish (stable releases only) ====================
      # Mirrors the iOS (pod trunk push) / Android (Maven) rule: any AGenUI-*
      # tag builds and uploads to GitHub Release, but only a pure x.y.z stable
      # tag is published to the ohpm public registry.
      - name: Publish HAR to ohpm.openharmony.cn
        if: steps.version.outputs.is_stable == 'true'
        env:
          OHPM_PRIVATE_KEY_BASE64: ${{ secrets.OHPM_PRIVATE_KEY_BASE64 }}
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
          OHPM_PRIVATE_KEY_PASSWORD: ${{ secrets.OHPM_PRIVATE_KEY_PASSWORD }}
        run: |
          # Fail fast if any required secret is missing; otherwise ohpm fails
          # later with a confusing "content of private key" error.
          if [[ -z "$OHPM_PRIVATE_KEY_BASE64" || -z "$OHPM_PUBLISH_ID" || -z "$OHPM_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::Missing secret(s). Required: OHPM_PRIVATE_KEY_BASE64, OHPM_PUBLISH_ID, OHPM_PRIVATE_KEY_PASSWORD."
            exit 1
          fi

          # Write the private key from the secret to a temp file (publish_ohpm_openharmony.sh
          # equivalent of KEY_PATH; the local machine path is not available in CI).
          # The secret stores the key base64-encoded to avoid newline/whitespace
          # corruption when pasting the multi-line PEM into GitHub Secrets.
          KEY_DIR="$(mktemp -d)"
          KEY_PATH="${KEY_DIR}/ohpm_agenui.key"
          echo "$OHPM_PRIVATE_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Fail fast if the decoded key is not a valid PEM private key,
          # otherwise ohpm retries signing indefinitely.
          if ! grep -q -- "-----BEGIN RSA PRIVATE KEY-----" "$KEY_PATH" || ! grep -q -- "-----END RSA PRIVATE KEY-----" "$KEY_PATH"; then
            echo "::error::Decoded OHPM private key is invalid (missing PEM markers)."
            echo "Re-create the OHPM_PRIVATE_KEY_BASE64 secret with: base64 -b 0 -i ohpm_agenui.key"
            rm -rf "$KEY_DIR"
            exit 1
          fi

          # Configure the private key password. The config key name depends
          # on the ohpm version: CLT ohpm 6.x uses "key_passphrase" (shown in
          # `ohpm config list -j`), while DevEco ohpm 5.x used
          # "private_key_password". Write both so the step works with either,
          # and avoid `set -x` so the password is never echoed to the log.
          mkdir -p "$HOME/.ohpm"
          touch "$HOME/.ohpm/.ohpmrc"
          chmod 600 "$HOME/.ohpm/.ohpmrc"
          for _rc_key in key_passphrase private_key_password; do
            if grep -q "^${_rc_key}=" "$HOME/.ohpm/.ohpmrc"; then
              sed -i "s|^${_rc_key}=.*|${_rc_key}=${OHPM_PRIVATE_KEY_PASSWORD}|" "$HOME/.ohpm/.ohpmrc"
            else
              echo "${_rc_key}=${OHPM_PRIVATE_KEY_PASSWORD}" >> "$HOME/.ohpm/.ohpmrc"
            fi
          done
          ohpm config set key_passphrase "$OHPM_PRIVATE_KEY_PASSWORD" >/dev/null 2>&1 || true
          echo "passphrase configured in ~/.ohpm/.ohpmrc (key_passphrase + private_key_password)"

          echo "Publishing dist/harmony/release/agenui.har to https://ohpm.openharmony.cn/ohpm/ ..."
          ohpm publish dist/harmony/release/agenui.har \
            --publish_registry "https://ohpm.openharmony.cn/ohpm/" \
            --publish_id "$OHPM_PUBLISH_ID" \
            --key_path "$KEY_PATH"

          # Clean up the private key file.
          rm -rf "$KEY_DIR"
          echo "✅ OHPM publish complete"

      # ==================== Summary ====================
      - name: Summary
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_STABLE="${{ steps.version.outputs.is_stable }}"
          echo "## HarmonyOS Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Type | $([ "$IS_STABLE" = 'true' ] && echo 'Stable' || echo 'Pre-release') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Release | HAR uploaded ✅ |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$IS_STABLE" == "true" ]]; then
            echo "| OHPM Registry | published ✅ |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| OHPM Registry | skipped (pre-release) ⏭️ |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Uploaded Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Description |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`AGenUI-${VERSION}-harmony.har\` | Full HAR (includes all .so) |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$IS_STABLE" == "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Users can now integrate via:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`shell" >> "$GITHUB_STEP_SUMMARY"
            echo "ohpm install @agenui/agenui" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Pre-release builds are uploaded to GitHub Release only." >> "$GITHUB_STEP_SUMMARY"
          fi
